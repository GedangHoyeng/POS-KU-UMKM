<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Struk Digital — POS-KU</title>
  <meta name="description" content="Struk digital transaksi POS-KU. Cetak, salin, atau kirim ke WhatsApp." />
  <meta name="theme-color" content="#0F766E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="min-h-screen bg-slate-100">

  <!-- ================= TOMBOL AKSI (tidak ikut tercetak) ================= -->
  <div class="no-print sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur-lg">
    <div class="mx-auto flex h-14 max-w-2xl items-center justify-between px-4">
      <a href="index.html" class="btn-ghost btn-sm">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Kembali
      </a>
      <div class="flex items-center gap-2">
        <button type="button" id="btn-copy" class="btn-secondary btn-sm">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.9" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
          </svg>
          Salin
        </button>
        <button type="button" id="btn-whatsapp" class="btn-secondary btn-sm">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.9" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
          </svg>
          WhatsApp
        </button>
        <button type="button" id="btn-print" class="btn-primary btn-sm">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.9" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Z" />
          </svg>
          Cetak
        </button>
      </div>
    </div>
  </div>

  <!-- ================= KERTAS STRUK ================= -->
  <main class="mx-auto max-w-md px-4 py-6">
    <div id="receipt-root" class="mx-auto bg-white p-6 shadow-card" style="max-width: 320px;">

      <!-- Header toko -->
      <div class="text-center">
        <h1 class="text-lg font-extrabold tracking-tight text-slate-900" id="receipt-store-name">POS-KU</h1>
        <p class="text-xs text-slate-500" id="receipt-store-tagline"></p>
        <p class="mt-1 text-xs text-slate-500" id="receipt-store-address"></p>
      </div>

      <div class="my-4 border-t border-dashed border-slate-300"></div>

      <!-- Info transaksi -->
      <div class="space-y-1 text-xs">
        <div class="flex justify-between">
          <span class="text-slate-500">No. Transaksi</span>
          <span class="font-bold tabular text-slate-900" id="receipt-number">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Tanggal</span>
          <span class="tabular text-slate-900" id="receipt-date">-</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Kasir</span>
          <span class="text-slate-900">Pemilik Toko</span>
        </div>
      </div>

      <div class="my-4 border-t border-dashed border-slate-300"></div>

      <!-- Daftar item -->
      <div id="receipt-items" class="space-y-2 text-xs">
        <!-- diisi oleh receipt.js -->
      </div>

      <div class="my-4 border-t border-dashed border-slate-300"></div>

      <!-- Ringkasan -->
      <div class="space-y-1.5 text-sm">
        <div class="flex justify-between">
          <span class="text-slate-600">Total</span>
          <span class="font-extrabold tabular text-slate-900" id="receipt-total">Rp 0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-600">Dibayar</span>
          <span class="tabular text-slate-900" id="receipt-paid">Rp 0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-600">Kembalian</span>
          <span class="font-bold tabular text-emerald-600" id="receipt-change">Rp 0</span>
        </div>
      </div>

      <div class="my-4 border-t border-dashed border-slate-300"></div>

      <!-- Footer -->
      <div class="text-center">
        <p class="text-xs font-semibold text-slate-700">Terima kasih telah berbelanja</p>
        <p class="mt-1 text-[10px] text-slate-400">
          Barang yang sudah dibeli tidak dapat ditukar
        </p>
        <p class="mt-3 text-[10px] text-slate-400" id="receipt-generated"></p>
      </div>

    </div>

    <!-- Pesan bila transaksi tidak ditemukan -->
    <div id="receipt-not-found" class="card empty-state hidden">
      <span class="empty-icon">
        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </span>
      <h3 class="text-base font-bold text-slate-900">Transaksi tidak ditemukan</h3>
      <p class="mt-1.5 text-sm text-slate-600">
        Nomor transaksi tidak ada di database. Periksa kembali nomor struk Anda.
      </p>
      <a href="transactions.html" class="btn-primary btn-sm mt-5">Lihat Riwayat</a>
    </div>
  </main>

  <!-- ================= SCRIPT ================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/localdb.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/receipt.js"></script>
</body>
</html>
