<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Katalog Digital — POS-KU</title>
  <meta name="description" content="Katalog digital toko UMKM: lihat daftar produk, harga, dan ketersediaan barang langsung dari perangkat Anda." />
  <meta name="theme-color" content="#0F766E" />
  <meta property="og:title" content="Katalog Digital" />
  <meta property="og:description" content="Lihat dagangan kami lengkap dengan harga dan ketersediaan stok." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="min-h-screen bg-white">

  <!-- ================= HEADER KATALOG ================= -->
  <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur-lg">
    <div class="mx-auto max-w-6xl px-4 py-3 sm:px-6">
      <div class="flex items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-3">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-brand-700 shadow-glow">
            <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" />
            </svg>
          </span>
          <div class="min-w-0">
            <h1 class="truncate text-base font-extrabold tracking-tight text-slate-900" id="catalog-store-name">Katalog Toko</h1>
            <p class="truncate text-xs text-slate-500" id="catalog-store-tagline">&mdash;</p>
          </div>
        </div>
        <a href="dashboard.html" class="btn-secondary btn-sm shrink-0">
          <span class="hidden sm:inline">Kelola Toko</span>
          <span class="sm:hidden">Admin</span>
        </a>
      </div>

      <!-- Pencarian + filter kategori -->
      <div class="mt-3 flex flex-col gap-2 sm:flex-row">
        <div class="relative flex-1">
          <svg class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"
               fill="none" viewBox="0 0 24 24" stroke-width="1.9" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607Z" />
          </svg>
          <input type="search" id="catalog-search" autocomplete="off"
                 class="form-input pl-11"
                 placeholder="Cari produk…"
                 aria-label="Cari produk di katalog" />
        </div>
        <select id="catalog-filter" class="form-select sm:w-52" aria-label="Filter kategori">
          <option value="">Semua kategori</option>
        </select>
      </div>

      <!-- Chip kategori -->
      <div class="mt-2 flex gap-2 overflow-x-auto no-scrollbar" id="catalog-chips" role="tablist" aria-label="Kategori">
        <!-- diisi oleh catalog.js -->
      </div>
    </div>
  </header>

  <!-- ================= DAFTAR PRODUK ================= -->
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6">

    <div id="catalog-loading" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
      <div class="card overflow-hidden"><div class="skeleton aspect-[4/3] rounded-none"></div><div class="p-3"><div class="skeleton h-4 w-3/4"></div><div class="skeleton mt-2 h-5 w-1/2"></div></div></div>
      <div class="card overflow-hidden"><div class="skeleton aspect-[4/3] rounded-none"></div><div class="p-3"><div class="skeleton h-4 w-3/4"></div><div class="skeleton mt-2 h-5 w-1/2"></div></div></div>
      <div class="card overflow-hidden"><div class="skeleton aspect-[4/3] rounded-none"></div><div class="p-3"><div class="skeleton h-4 w-3/4"></div><div class="skeleton mt-2 h-5 w-1/2"></div></div></div>
      <div class="card overflow-hidden"><div class="skeleton aspect-[4/3] rounded-none"></div><div class="p-3"><div class="skeleton h-4 w-3/4"></div><div class="skeleton mt-2 h-5 w-1/2"></div></div></div>
    </div>

    <div id="catalog-grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></div>

    <div id="catalog-empty" class="card empty-state hidden">
      <span class="empty-icon">
        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607Z" />
        </svg>
      </span>
      <h3 class="text-base font-bold text-slate-900">Produk tidak ditemukan</h3>
      <p class="mt-1.5 max-w-xs text-sm text-slate-600">
        Coba kata kunci lain atau pilih kategori yang berbeda.
      </p>
    </div>

    <!-- Info toko di bagian bawah -->
    <section class="mt-10 rounded-3xl bg-ink-900 p-6 text-center sm:p-8">
      <h2 class="text-lg font-extrabold text-white" id="catalog-footer-name">Toko Kami</h2>
      <p class="mx-auto mt-2 max-w-md text-sm text-slate-400" id="catalog-footer-tagline"></p>
      <p class="mt-4 text-xs text-slate-500" id="catalog-footer-address"></p>
    </section>

  </main>

  <!-- ================= SCRIPT ================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/localdb.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
